<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f8" />
  <title>Antmoji Profile</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/src/demo/demo.css" />
</head>
<body>
  <main class="app">
    <header class="cover">
      <div class="cover-glow"></div>
      <div class="cover-bar">
        <span class="brand">antmoji</span>
        <button class="icon-btn" id="share" aria-label="Copy avatar code" title="Copy avatar code">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg>
        </button>
      </div>
    </header>

    <section class="profile">
      <div class="avatar-ring">
        <ant-moji id="avatar" framing="bust" class="avatar"></ant-moji>
        <button class="edit-fab" id="edit-fab" aria-label="Edit Antmoji">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </div>
      <h1 class="name">Garvit</h1>
      <p class="handle">@garvit · colony builder</p>
      <p class="bio">Shipping tiny things with big antennae. Tap my ant to say hi.</p>
      <div class="stats">
        <div><b>128</b><span>Posts</span></div>
        <div><b>2.4k</b><span>Colony</span></div>
        <div><b>312</b><span>Following</span></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="edit-btn">Customize Antmoji</button>
        <button class="btn" id="wave-btn">Say hi</button>
      </div>
    </section>

    <section class="card showcase">
      <div class="card-head">
        <h2>My Antmoji</h2>
        <span class="hint">Drag to spin</span>
      </div>
      <ant-moji id="full" framing="full" class="full"></ant-moji>
    </section>

    <section class="card">
      <div class="card-head"><h2>Colony friends</h2><span class="hint">Static renders · one shared GPU context</span></div>
      <div class="friends" id="friends"></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>In a chat</h2></div>
      <div class="chat" id="chat"></div>
    </section>
  </main>

  <dialog id="editor-dialog" class="editor-dialog" aria-label="Antmoji editor">
    <div class="editor-host" id="editor-host"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/demo/main.js"></script>
</body>
</html>
